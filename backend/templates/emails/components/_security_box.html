{# SECURITY TIPS BOX (amber background)
   Variable: security_items — list of strings
   Optional: security_heading (default "Security reminder")
#}
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0"
       style="border:1px solid #fde68a;border-radius:8px;margin:0 0 28px;" class="dm-warn-box">
<tr>
  <td style="background-color:#fefce8;border-radius:8px;padding:16px 20px;" class="dm-warn-box">
    <p style="margin:0 0 10px 0;font-size:13px;font-weight:700;color:#92400e;font-family:Arial,Helvetica,sans-serif;" class="dm-warn-text">&#128274;&nbsp; {{ security_heading|default:"Security reminder" }}</p>
    {% for item in security_items %}
    <table role="presentation" cellpadding="0" cellspacing="0" border="0" style="margin:0 0 2px;">
    <tr>
      <td style="width:16px;vertical-align:top;padding-top:3px;font-size:13px;color:#78350f;" class="dm-warn-text">&bull;</td>
      <td style="padding-left:6px;font-size:13px;color:#78350f;line-height:1.7;font-family:Arial,Helvetica,sans-serif;" class="dm-warn-text">{{ item }}</td>
    </tr>
    </table>
    {% endfor %}
  </td>
</tr>
</table>
