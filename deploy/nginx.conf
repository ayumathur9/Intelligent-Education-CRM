# =============================================================================
# Nginx configuration for Intelligent Education CRM
# Production deployment: Nginx → Django (Daphne/Gunicorn over ASGI)
#
# CRIT-1: X-Accel-Redirect for private media (set NGINX_MEDIA_ACCEL=1 in Django env)
# HIGH-5: Trusted X-Forwarded-For via set_real_ip_from
# =============================================================================

# Upstream Django/Daphne ASGI server
upstream django_asgi {
    server 127.0.0.1:8000;
    keepalive 32;
}

# Rate-limiting zones
limit_req_zone $binary_remote_addr zone=api_zone:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=login_zone:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=upload_zone:10m rate=2r/s;

server {
    listen 80;
    server_name _;

    # Redirect all HTTP → HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name your-domain.example.com;   # ← Replace with your actual domain

    # ---------------------------------------------------------------------------
    # TLS
    # ---------------------------------------------------------------------------
    ssl_certificate     /etc/ssl/certs/fullchain.pem;
    ssl_certificate_key /etc/ssl/private/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5:!RC4;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;
    ssl_stapling        on;
    ssl_stapling_verify on;

    # ---------------------------------------------------------------------------
    # Security headers (Django's SecurityHeadersMiddleware sets CSP/COEP etc.;
    # add only headers that Django doesn't set itself)
    # ---------------------------------------------------------------------------
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "same-origin" always;

    # ---------------------------------------------------------------------------
    # Request limits
    # ---------------------------------------------------------------------------
    client_max_body_size 15m;        # Must match DATA_UPLOAD_MAX_MEMORY_SIZE
    client_body_buffer_size 256k;
    client_header_buffer_size 4k;
    large_client_header_buffers 4 16k;

    # ---------------------------------------------------------------------------
    # Trusted proxy IP extraction (HIGH-5)
    # Add your load balancer / Railway proxy IP ranges here.
    # ---------------------------------------------------------------------------
    real_ip_header      X-Forwarded-For;
    real_ip_recursive   on;
    # set_real_ip_from  10.0.0.0/8;   # Example: private network range

    # ---------------------------------------------------------------------------
    # Static files (served directly by Nginx — WhiteNoise fallback via Django)
    # ---------------------------------------------------------------------------
    location /static/ {
        alias /app/staticfiles/;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ---------------------------------------------------------------------------
    # CRIT-1: Private media — served by Nginx via X-Accel-Redirect
    # Django authenticates the request at /media/ and issues X-Accel-Redirect.
    # Nginx then serves from this internal location.
    # ---------------------------------------------------------------------------
    location /protected-media/ {
        internal;
        alias /app/media/;     # Must match MEDIA_ROOT
        expires 1h;
        add_header Cache-Control "private, no-store";
        add_header X-Content-Type-Options "nosniff";
    }

    # ---------------------------------------------------------------------------
    # Tutorial video — served by Nginx via X-Accel-Redirect from /tutorial-video/
    # Django authenticates the student, then Nginx streams the MP4 with full
    # HTTP range-request support so the browser can seek without rebuffering.
    # Place your video at: /app/media/tutorials/crm_tutorial.mp4
    # ---------------------------------------------------------------------------
    location /protected-tutorial/ {
        internal;
        alias /app/media/tutorials/;
        mp4;                           # Enable MP4 pseudo-streaming (seek support)
        mp4_buffer_size     1m;
        mp4_max_buffer_size 5m;
        add_header Cache-Control "private, max-age=3600";
        add_header Accept-Ranges     bytes;
        add_header X-Content-Type-Options "nosniff";
    }

    # ---------------------------------------------------------------------------
    # WebSocket upgrade (Django Channels)
    # ---------------------------------------------------------------------------
    location /ws/ {
        proxy_pass         http://django_asgi;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;

        limit_req zone=api_zone burst=20 nodelay;
    }

    # ---------------------------------------------------------------------------
    # Upload endpoints — stricter rate limiting
    # ---------------------------------------------------------------------------
    location ~ ^/api/files/ {
        limit_req zone=upload_zone burst=10 nodelay;
        limit_req_status 429;

        proxy_pass         http://django_asgi;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # ---------------------------------------------------------------------------
    # Login endpoints — tight rate limiting
    # ---------------------------------------------------------------------------
    location ~ ^/api/auth/login/ {
        limit_req zone=login_zone burst=3 nodelay;
        limit_req_status 429;

        proxy_pass         http://django_asgi;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # ---------------------------------------------------------------------------
    # All other requests → Django
    # ---------------------------------------------------------------------------
    location / {
        limit_req zone=api_zone burst=50 nodelay;
        limit_req_status 429;

        proxy_pass         http://django_asgi;
        proxy_http_version 1.1;
        proxy_set_header   Connection "";
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;

        # Gzip compression
        gzip on;
        gzip_types text/plain application/json application/javascript text/css;
        gzip_min_length 1024;
        gzip_proxied any;
        gzip_vary on;
    }

    # ---------------------------------------------------------------------------
    # Health check — no rate limit, no logging
    # ---------------------------------------------------------------------------
    location /api/health/ {
        proxy_pass http://django_asgi;
        proxy_set_header Host $host;
        access_log off;
    }

    # Block access to hidden files (e.g., .env, .git)
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}
