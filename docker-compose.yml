services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: intelligent_education_crm
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d intelligent_education_crm"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DJANGO_ENV: development
      DJANGO_DEBUG: "1"
      DJANGO_SECRET_KEY: dev-only-change-me
      DJANGO_ALLOWED_HOSTS: "localhost,127.0.0.1"
      DJANGO_CORS_ALLOWED_ORIGINS: "http://localhost:5500,http://127.0.0.1:5500"
      DATABASE_URL: "postgres://postgres:postgres@db:5432/intelligent_education_crm"
      FRONTEND_BASE_URL: "http://localhost:5500"
      TEMPLATE_ROOT: "/project"
    volumes:
      - .:/project
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:

